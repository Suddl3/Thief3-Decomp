; Steady view (T3SDK): a first-person camera that follows Garrett instead of
; his animations, a body that faces where you look, and held items that do not
; cut into the view. Changes take effect at the next start.
[View]
; How long the eye takes to follow Garrett's animations, in milliseconds:
; higher is steadier (breathing, walking, landing). 0 = the eye rides the
; animation as the game has it.
; @range 0..250 step 5
; @label Smoothing (ms)
Smoothing=80
; How much of the animation's head movement stays on top of the smoothing:
; 0 = none, 1 = all of it.
; @range 0..1 step 0.05
HeadBob=0.25
[Turning]
; How fast Garrett's body turns to where you look once he moves, in degrees a
; second. 0 = at once, so he walks straight where you point him. The game
; turns at 302, which makes starting off at an angle curve.
; @range 0..720 step 10
; @label Body turn speed
BodyTurnSpeed=0
[Clipping]
; How close to the eye things are still drawn, in Unreal units. The game uses
; 1.0, which cuts into the bow and held items, more so with a wide field of
; view. Very low values can make distant surfaces flicker.
; @range 0.1..1 step 0.05
; @label Near clip distance
NearClip=0.5
