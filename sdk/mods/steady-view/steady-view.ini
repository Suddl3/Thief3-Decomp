; Steady view (T3SDK): a first-person camera that follows Garrett instead of
; his animations, a body that faces where you look, and held items that do not
; cut into the view. Changes take effect at the next start.
[View]
; The eye stays at a resting spot relative to Garrett instead of riding his
; animations. When his stance changes (standing, moving, crouching), the spot
; follows over this many milliseconds. 0 = the eye rides the animation as the
; game has it.
; @range 0..1000 step 10
; @label Smoothing (ms)
Smoothing=250
; How much of the animation's head movement stays on top of the resting spot:
; 0 = none, 1 = all of it.
; @range 0..1 step 0.05
HeadBob=0.15
; When Garrett lands, steps down a stair or reaches the top of a climb, his
; body jumps to its new height in one frame. The view eases there over this
; many milliseconds instead. 0 = it jumps with him.
; @range 0..400 step 10
; @label Landing smoothing (ms)
LandingSmoothing=120
[Turning]
; How fast Garrett's body turns to where you look once he moves, in degrees a
; second. 0 = at once, so he walks straight where you point him. The game
; turns at 302, which makes starting off at an angle curve.
; @range 0..720 step 10
; @label Body turn speed
BodyTurnSpeed=0
[Clipping]
; How close to the eye things are still drawn, in Unreal units. The game uses
; 1.0, which cuts into the bow and held items, more so with a wide field of
; view. Very low values can make distant surfaces flicker.
; @range 0.1..1 step 0.05
; @label Near clip distance
NearClip=0.5
