; Loading screen tweaks (T3SDK). Changes take effect at the next start; with
; both settings off the mod stays unloaded.
[Loading]
; Skip loading-screen redraws closer together than this many milliseconds
; (at most 1000): levels load faster, most with VSynch on. 0 = redraw as often
; as the game asks.
MinRedrawMs=20
; Hold these keys to stop loading on the current screen and read it, while the
; game has the focus (virtual-key codes held together, comma-separated;
; 17 = Ctrl). Empty = off.
HoldKeys=17
