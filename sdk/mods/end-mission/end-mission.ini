; End mission (T3SDK): a key combination that ends the current mission as if
; its exit was reached. Works in missions only, not in city sections.
; Changes take effect at the next start.
[EndMission]
; Virtual-key codes to hold together, separated by commas (16 Shift, 17 Ctrl,
; 18 Alt, 35 End). Empty = off.
Keys=16,17,18,35
