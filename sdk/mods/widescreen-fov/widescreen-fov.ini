; Widescreen FOV mod (T3SDK). Changes take effect at the next start.
[FOV]
; Widen the cameras' field of view on screens wider than 4:3 (Hor+): 1 on, 0 off.
HorPlus=1
; The player camera's field of view at 4:3, in degrees. The game uses 85.
PlayerFOV=85
; Log the first read of each FOV property to T3SDK.log, with its value: 1 on, 0 off.
LogReads=1
