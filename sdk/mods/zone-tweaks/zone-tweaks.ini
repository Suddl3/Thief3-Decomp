; Zone tweaks (T3SDK): fog distance and ambient light in every level.
; Changes take effect at the next level. 1.0 leaves a value as the game has it;
; with both at 1.0 the mod stays off.
[Zones]
; Multiplies where the distance fog starts and ends: 2.0 pushes the fog twice
; as far away, 0.5 brings it closer.
FogDistance=1.0
; Multiplies the zones' ambient brightness: 1.5 lightens dark areas.
AmbientLight=1.0
