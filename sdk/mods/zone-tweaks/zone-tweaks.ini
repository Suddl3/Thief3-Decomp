; Zone tweaks (T3SDK): fog distance and ambient light in every level.
; Changes take effect at the next start. 1.0 leaves a value as the game has it;
; with both at 1.0 the mod stays off. Each value is a number above 0 up to 100;
; anything else counts as 1.0.
[Zones]
; Multiplies where the distance fog starts and ends: 2.0 pushes the fog twice
; as far away, 0.5 brings it closer.
; @range 0.1..10 step 0.05
FogDistance=1.0
; Multiplies the zones' ambient brightness: 1.5 lightens dark areas.
; @range 0.1..10 step 0.05
AmbientLight=1.0
