; Unstick (T3SDK): a key combination that frees Garrett when he is stuck in
; the floor, floating or skating around. Changes take effect at the next start.
[Unstick]
; Virtual-key codes to hold together, separated by commas (16 Shift, 17 Ctrl,
; 13 Enter; decimal or 0x hex). Codes outside 1 to 255 are dropped; with no
; valid code left the mod stays off.
Keys=16,17,13
