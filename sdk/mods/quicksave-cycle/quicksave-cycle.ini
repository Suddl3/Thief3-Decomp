; Quick save cycling (T3SDK). Changes take effect at the next start.
; The number of the last quick save is kept in quicksave-cycle.state next to
; the DLL.
[QuickSave]
; 1 = quick save takes turns between Count saves ("Quick Save 1", "Quick Save 2",
; ...) and quick load loads the newest; this writes extra save games. 0 = off.
Enabled=0
; How many quick saves to keep, 2 to 9 (anything else counts as 3).
Count=3
