; Difficulty fixes (T3SDK). Changes take effect at the next start.
[Difficulty]
; Load the AI's difficulty multipliers when a mission loads, so missions play
; at the chosen difficulty instead of Normal: 1 on, 0 off. Default 1.
ApplyOnMissionLoad=1
; Preselect the difficulty being played in the Enter Mission and Restart
; Mission menus instead of the game's default (a custom difficulty and
; missions with a fixed difficulty are left alone): 1 on, 0 off. Default 1.
KeepInMissionMenus=1
