; HUD tweaks (T3SDK). 1 = on, 0 = off. Changes take effect at the next start.
[HUD]
; A picked-up junk item stays lit instead of flashing.
SteadyJunkItem=1
; No "nothing equipped" text in the item and weapon cycles.
HideEmptyHands=0
; The health bar stays on screen (at its Pos_X/Pos_Y from T3UI.ini) instead of
; sliding away when nothing changes.
HealthAlwaysShown=0
; The lockpicking HUD (the picks' positions) is hidden below the screen.
; @label Hide lockpicking HUD
HideLockpickHud=0
; Books and scrolls show over the paused game instead of a black screen.
; @label Books over the game
WorldBehindBooks=0
